<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 일본어 단어장</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:1.5rem 1rem}

/* 로딩 */
#loadingScreen{text-align:center;padding:6rem 1rem;color:#999;font-size:14px}

/* 로그인 */
.auth-wrap{max-width:400px;margin:5rem auto;padding:2rem;background:#fff;border-radius:16px;border:1px solid #e8e8e8;text-align:center}
.auth-wrap .icon{font-size:44px;margin-bottom:12px}
.auth-wrap h2{font-size:20px;font-weight:600;margin-bottom:8px}
.auth-wrap p{font-size:14px;color:#888;margin-bottom:1.5rem;line-height:1.6}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:15px;font-family:inherit;cursor:pointer;transition:background 0.15s}
.google-btn:hover{background:#f5f5f3}

/* 레벨 선택 모달 */
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal{background:#fff;border-radius:16px;padding:1.75rem;width:100%;max-width:360px}
.modal h3{font-size:17px;font-weight:600;margin-bottom:6px}
.modal p{font-size:13px;color:#888;margin-bottom:1.25rem;line-height:1.6}
.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.level-btn{padding:12px 6px;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all 0.15s;font-family:inherit}
.level-btn:hover{border-color:#aaa;background:#f5f5f3}
.level-btn.selected{border-color:#1D9E75;background:#E1F5EE;color:#085041}
.level-btn .sub{font-size:10px;font-weight:400;margin-top:2px;color:#aaa}
.level-btn.selected .sub{color:#0F6E56}
.level-desc-text{font-size:12px;color:#888;text-align:center;margin-bottom:1rem;min-height:16px}
.confirm-btn{width:100%;padding:11px;border-radius:10px;background:#1D9E75;color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.confirm-btn:hover{background:#0F6E56}

/* 상단 바 */
.topbar{background:#fff;border-bottom:1px solid #e8e8e8;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;border-radius:12px}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-title{font-size:16px;font-weight:600}
.level-badge{font-size:12px;padding:4px 10px;border-radius:20px;background:#E1F5EE;color:#085041;border:1px solid #5DCAA5;cursor:pointer;display:flex;align-items:center;gap:3px;font-weight:600}
.level-badge:hover{background:#c8f0e2}
.topbar-right{display:flex;align-items:center;gap:8px}
.user-email{font-size:12px;color:#aaa}
.signout-btn{font-size:12px;color:#aaa;background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;font-family:inherit}
.signout-btn:hover{background:#f0f0ee;color:#1a1a1a}

/* 탭 */
.tabs{display:flex;border:1px solid #e0e0e0;border-radius:8px;overflow:hidden;margin-bottom:1.25rem;background:#fff;width:fit-content}
.tab{padding:9px 15px;font-size:13px;cursor:pointer;background:transparent;border:none;color:#aaa;font-family:inherit}
.tab.active{background:#f0f0ee;color:#1a1a1a;font-weight:600}
.tab:not(:last-child){border-right:1px solid #e0e0e0}
.section{display:none}.section.active{display:block}

/* 공통 */
input,select,textarea{padding:9px 12px;border:1px solid #ddd;border-radius:8px;background:#fafafa;color:#1a1a1a;font-size:14px;font-family:inherit;outline:none;transition:border-color 0.15s}
input:focus,select:focus,textarea:focus{border-color:#1D9E75}
.btn{padding:9px 16px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;font-family:inherit;transition:background 0.15s}
.btn:hover{background:#f0f0ee}
.btn-primary{background:#1D9E75;color:#fff;border-color:#1D9E75}
.btn-primary:hover{background:#0F6E56}
.empty{text-align:center;padding:3rem 1rem;color:#999;font-size:14px}
.empty .icon{font-size:36px;margin-bottom:10px}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;background:#E6F1FB;color:#0C447C}

/* 추천 단어 */
.recommend-wrap{margin-bottom:1.25rem}
.recommend-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.recommend-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.recommend-level{font-size:11px;color:#aaa;font-weight:400}
.refresh-btn{font-size:12px;color:#888;background:#fff;border:1px solid #ddd;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit}
.refresh-btn:hover{background:#f5f5f3}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.rec-card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;transition:border-color 0.15s}
.rec-card:hover{border-color:#aaa}
.rec-jp{font-size:22px;font-weight:600;color:#1a1a1a}
.rec-ro{font-size:11px;color:#185FA5;margin-bottom:2px}
.rec-mean{font-size:12px;color:#666;flex:1}
.rec-add{margin-top:8px;font-size:11px;padding:5px;border:1px solid #1D9E75;border-radius:6px;color:#1D9E75;background:none;cursor:pointer;width:100%;font-family:inherit}
.rec-add:hover{background:#E1F5EE}
.rec-add.added{border-color:#aaa;color:#aaa;cursor:default}

/* 검색 */
.search-divider{height:1px;background:#e8e8e8;margin:1rem 0}
.search-row{display:flex;gap:8px;margin-bottom:1rem}
.search-row input{flex:1}
.result-area{min-height:60px}
.result-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:1rem 1.25rem;margin-bottom:8px}
.result-word{font-size:26px;font-weight:600;margin-bottom:6px}
.reading-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.reading-kana{font-size:14px;color:#185FA5}
.reading-sep{color:#ddd}
.reading-label{font-size:11px;padding:1px 7px;border-radius:20px;background:#f0f0ee;color:#666}
.reading-val{font-size:13px;color:#185FA5;margin-left:2px}
.meaning-text{font-size:14px;color:#555;margin-bottom:8px;line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.add-btn-full{width:100%;margin-top:10px;padding:9px;border:none;border-radius:8px;background:#1D9E75;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.add-btn-full:hover{background:#0F6E56}
.add-btn-full:disabled{cursor:default}
.add-btn-full.added{background:#e8e8e8;color:#888;cursor:default}
.add-btn-full.added:hover{background:#e8e8e8}
.add-btn-full.saving{background:#5DCAA5;cursor:wait}

/* 단어장 */
.word-list{display:flex;flex-direction:column;gap:6px}
.word-row{display:grid;grid-template-columns:156px 95px 1fr auto auto;align-items:center;gap:10px;background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:10px 14px;cursor:pointer;transition:border-color 0.15s}
.word-row:hover{border-color:#aaa}
.word-row.open{border-color:#1D9E75}
.word-row .jp{font-size:19px;font-weight:600}
.word-row .ro{font-size:12px;color:#185FA5}
.word-row .mean{font-size:13px;color:#666}
.del-btn{background:none;border:none;color:#ccc;cursor:pointer;padding:4px;border-radius:4px;font-size:16px;line-height:1}
.del-btn:hover{color:#e05555}

/* 사전 패널 */
.dict-panel{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:1.25rem;margin-bottom:10px}
.dict-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.dict-word{font-size:32px;font-weight:600}
.dict-kana{font-size:15px;color:#185FA5;margin-top:2px}
.dict-romaji{font-size:13px;color:#aaa;margin-top:2px}
.dict-close{background:none;border:none;font-size:18px;color:#aaa;cursor:pointer;padding:4px}
.dict-close:hover{color:#555}
.dict-label{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px}
.dict-meaning{font-size:15px;color:#1a1a1a;margin-bottom:2px}
.dict-pos{font-size:12px;color:#888;margin-bottom:6px}
.dict-example{background:#f8f8f6;border-radius:8px;padding:10px 12px;margin-top:6px}
.dict-link{color:#185FA5;font-size:13px}

/* 플래시카드 */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:0.5rem 0}
.fc-stats{display:flex;gap:16px;font-size:13px;color:#888}
.fc-stats b{color:#1a1a1a}
.card-area{width:100%;perspective:1000px;cursor:pointer}
.card-inner{width:100%;min-height:230px;position:relative;transform-style:preserve-3d;transition:transform 0.4s}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;min-height:230px;backface-visibility:hidden;background:#fff;border:1px solid #e8e8e8;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:2rem}
.card-back{transform:rotateY(180deg)}
.card-hint{font-size:12px;color:#ccc;margin-top:8px}
.card-main{font-size:50px;font-weight:600}
.card-kana{font-size:18px;color:#185FA5}
.card-ro-label{font-size:11px;color:#aaa;margin-top:4px}
.card-ro-val{font-size:18px;font-weight:600}
.card-mean{font-size:15px;color:#555;margin-top:4px}
.fc-btns{display:flex;gap:10px;width:100%}
.fc-btns button{flex:1;padding:12px;border-radius:10px;font-size:14px;cursor:pointer;border:1px solid #ddd;background:#fff;font-family:inherit;transition:background 0.15s}
.btn-wrong{border-color:#f09595!important;color:#a32d2d!important}.btn-wrong:hover{background:#fff0f0}
.btn-right{border-color:#5dcaa5!important;color:#085041!important}.btn-right:hover{background:#f0faf6}
.fc-done{text-align:center;padding:2rem}
.fc-done .score{font-size:38px;font-weight:700;color:#1a1a1a;margin-bottom:6px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}

/* 단어시험 */
.quiz-options{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.quiz-opt-btn{padding:8px 14px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#888;font-size:13px;cursor:pointer;font-family:inherit}
.quiz-opt-btn.selected{background:#f0f0ee;color:#1a1a1a;border-color:#aaa;font-weight:600}
.quiz-table{width:100%;border-collapse:collapse;margin-bottom:1rem;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e8e8e8}
.quiz-table th{font-size:12px;color:#888;font-weight:600;padding:10px 12px;border-bottom:1px solid #eee;text-align:left;background:#fafafa}
.quiz-table td{padding:8px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.quiz-table tr:last-child td{border-bottom:none}
.quiz-num{font-size:12px;color:#bbb;width:28px}
.revealed-jp{font-size:17px;font-weight:600}
.revealed-ro{font-size:13px;color:#185FA5}
.revealed-mean{font-size:13px;color:#555}
.quiz-input{width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;background:#fafafa;font-family:inherit}
.quiz-input.correct{border-color:#5dcaa5;background:#f0faf6;color:#085041}
.quiz-input.wrong{border-color:#f09595;background:#fff0f0;color:#a32d2d}
.quiz-answer{font-size:12px;color:#a32d2d;margin-top:3px;display:none}
.quiz-answer.show{display:block}
.quiz-actions{display:flex;gap:8px;flex-wrap:wrap}
.quiz-score{font-size:14px;color:#555;margin-top:10px;display:none}
.quiz-score b{color:#1a1a1a;font-size:18px}

@media(max-width:500px){
  .word-row{grid-template-columns:132px 80px 1fr auto}
  .word-row .pill{display:none}
  .tabs .tab{padding:9px 10px;font-size:12px}
  .topbar{flex-wrap:wrap;gap:6px}
}
</style>
</head>
<body>

<div id="loadingScreen">잠시만요...</div>

<!-- 로그인 -->
<div id="authScreen" style="display:none">
  <div class="auth-wrap">
    <div class="icon">🍵</div>
    <h2>내 일본어 단어장</h2>
    <p>구글 계정으로 로그인하면<br>어디서든 내 단어장을 볼 수 있어요</p>
    <button class="google-btn" onclick="signInWithGoogle()">
      <img src="https://www.google.com/favicon.ico" width="18" height="18" alt="">
      Google로 로그인
    </button>
  </div>
</div>

<!-- 레벨 선택 모달 -->
<div id="levelModal" class="modal-bg" style="display:none">
  <div class="modal">
    <h3>일본어 레벨을 선택해요</h3>
    <p>레벨에 맞는 단어를 매일 추천해드려요.<br>나중에 언제든 바꿀 수 있어요.</p>
    <div class="level-grid">
      <div class="level-btn" onclick="selectLevel('hiragana')" id="lvl-hiragana">히라가나<div class="sub">문자 입문</div></div>
      <div class="level-btn" onclick="selectLevel('N5')" id="lvl-N5">N5<div class="sub">입문</div></div>
      <div class="level-btn" onclick="selectLevel('N4')" id="lvl-N4">N4<div class="sub">초급</div></div>
      <div class="level-btn" onclick="selectLevel('N3')" id="lvl-N3">N3<div class="sub">중급</div></div>
      <div class="level-btn" onclick="selectLevel('N2')" id="lvl-N2">N2<div class="sub">고급</div></div>
      <div class="level-btn" onclick="selectLevel('N1')" id="lvl-N1">N1<div class="sub">최고급</div></div>
    </div>
    <div class="level-desc-text" id="levelDescText">레벨을 선택해주세요</div>
    <button class="confirm-btn" onclick="confirmLevel()">시작하기</button>
  </div>
</div>

<!-- 앱 메인 -->
<div id="appScreen" style="display:none">
  <div class="wrap">
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">🍵 내 단어장</span>
        <div class="level-badge" onclick="openLevelModal()" id="levelBadge">N5 ▾</div>
      </div>
      <div class="topbar-right">
        <span class="user-email" id="userEmail"></span>
        <button class="signout-btn" onclick="signOut()">로그아웃</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('search')">🔍 검색</button>
      <button class="tab" onclick="switchTab('list')">📖 단어장</button>
      <button class="tab" onclick="switchTab('flash')">🃏 플래시카드</button>
      <button class="tab" onclick="switchTab('quiz')">✏️ 단어시험</button>
    </div>

    <!-- 검색 탭 -->
    <div id="sec-search" class="section active">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="단어 직접 검색... 예: 食べる, 학교" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn btn-primary" onclick="doSearch()">검색</button>
      </div>
      <div class="result-area" id="resultArea"></div>
      <div class="search-divider"></div>
      <div class="recommend-wrap">
        <div class="recommend-header">
          <div class="recommend-title">✨ 오늘의 추천 단어 <span class="recommend-level" id="recLevelLabel"></span></div>
          <button class="refresh-btn" onclick="refreshRec()">↻ 다른 단어</button>
        </div>
        <div class="rec-grid" id="recGrid"></div>
      </div>
    </div>

    <!-- 단어장 탭 -->
    <div id="sec-list" class="section">
      <div id="dictPanel" style="display:none"></div>
      <div id="wordList"></div>
    </div>

    <!-- 플래시카드 탭 -->
    <div id="sec-flash" class="section"><div id="flashArea"></div></div>

    <!-- 단어시험 탭 -->
    <div id="sec-quiz" class="section">
      <div id="quizSetup">
        <p style="font-size:13px;color:#888;margin-bottom:10px">공개할 열을 선택하세요 — 나머지 두 열을 직접 채워요.</p>
        <div class="quiz-options">
          <button class="quiz-opt-btn selected" id="qopt-kanji" onclick="selectMode('kanji')">🈳 한자 공개</button>
          <button class="quiz-opt-btn" id="qopt-romaji" onclick="selectMode('romaji')">🔤 로마자 공개</button>
          <button class="quiz-opt-btn" id="qopt-meaning" onclick="selectMode('meaning')">💬 뜻 공개</button>
          <button class="quiz-opt-btn" id="qopt-random" onclick="selectMode('random')">🔀 랜덤 혼합</button>
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">▶ 시험 시작</button>
      </div>
      <div id="quizArea"></div>
    </div>
  </div>
</div>

<script>
console.log('%c[단어장 빌드: 2026-05-29 v4]','color:#1D9E75;font-weight:bold');
const SUPABASE_URL='https://gtkobkwxmlepahhprper.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0a29ia3d4bWxlcGFoaHBycGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NTE1MjEsImV4cCI6MjA5NTUyNzUyMX0.Vww5_UtclZVTWkTZBUZ_xteGYBgkXG-ikzfciU7b1hs';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// OAuth 콜백 진단: 리디렉트로 돌아온 URL에 에러가 실려오면 콘솔에 표시
(function(){
  const qs=new URLSearchParams(location.search);
  const hs=new URLSearchParams(location.hash.replace(/^#/,''));
  const err=qs.get('error_description')||hs.get('error_description')||qs.get('error')||hs.get('error');
  if(err)console.error('[auth callback error]',decodeURIComponent(err));
})();

// 히라가나 → 로마자 변환
const hToR={"あ":"a","い":"i","う":"u","え":"e","お":"o","か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko","さ":"sa","し":"shi","す":"su","せ":"se","そ":"so","た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to","な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no","は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho","ま":"ma","み":"mi","む":"mu","め":"me","も":"mo","や":"ya","ゆ":"yu","よ":"yo","ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro","わ":"wa","を":"wo","ん":"n","が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go","ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo","だ":"da","ぢ":"di","づ":"du","で":"de","ど":"do","ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo","ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po","きゃ":"kya","きゅ":"kyu","きょ":"kyo","しゃ":"sha","しゅ":"shu","しょ":"sho","ちゃ":"cha","ちゅ":"chu","ちょ":"cho","にゃ":"nya","にゅ":"nyu","にょ":"nyo","ひゃ":"hya","ひゅ":"hyu","ひょ":"hyo","みゃ":"mya","みゅ":"myu","みょ":"myo","りゃ":"rya","りゅ":"ryu","りょ":"ryo","ぎゃ":"gya","ぎゅ":"gyu","ぎょ":"gyo","じゃ":"ja","じゅ":"ju","じょ":"jo","びゃ":"bya","びゅ":"byu","びょ":"byo","ぴゃ":"pya","ぴゅ":"pyu","ぴょ":"pyo","っ":"","ー":"-"};
function toRomaji(h){if(!h)return'';let r='',i=0;while(i<h.length){const two=h.slice(i,i+2),one=h[i];if(hToR[two]){r+=hToR[two];i+=2;}else if(hToR[one]){r+=hToR[one];i++;}else{r+=one;i++;}}return r;}

// 인라인 onclick 인자용: 따옴표를 HTML 엔티티로 이스케이프
const enc=s=>JSON.stringify(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');

// 응답이 안 오고 멈추는 경우를 에러로 드러내기 위한 타임아웃 래퍼
function withTimeout(p,ms=10000){
  return Promise.race([
    Promise.resolve(p),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('서버 응답 없음(타임아웃 '+ms+'ms)')),ms))
  ]);
}

// 레벨 관리
async function loadUserLevel(){
  const {data}=await sb.from('words').select('jlpt').limit(1);
  const stored=localStorage.getItem('userLevel_'+currentUser.id);
  if(stored){userLevel=stored;}
  else{openLevelModal(true);}
  updateLevelBadge();
}

function openLevelModal(isFirst=false){
  selectedLevel=userLevel;
  document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('selected'));
  const btn=document.getElementById('lvl-'+selectedLevel);
  if(btn)btn.classList.add('selected');
  document.getElementById('levelDescText').textContent=levelDesc[selectedLevel]||'레벨을 선택해주세요';
  document.getElementById('levelModal').style.display='flex';
}
function selectLevel(lv){
  selectedLevel=lv;
  document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('lvl-'+lv).classList.add('selected');
  document.getElementById('levelDescText').textContent=levelDesc[lv]||'';
}
function confirmLevel(){
  userLevel=selectedLevel;
  localStorage.setItem('userLevel_'+currentUser.id,userLevel);
  document.getElementById('levelModal').style.display='none';
  updateLevelBadge();
  recOffset=0;
  renderRec();
}
function updateLevelBadge(){
  document.getElementById('levelBadge').textContent=(userLevel==='hiragana'?'ひらがな':userLevel)+' ▾';
}

// 추천 단어
function renderRec(){
  const pool=wordPool[userLevel]||wordPool['N5'];
  const label=userLevel==='hiragana'?'히라가나 입문':userLevel;
  document.getElementById('recLevelLabel').textContent=label+' 기준';
  const shuffled=[...pool].sort(()=>Math.random()-0.5);
  const items=shuffled.slice(0,5);
  const savedWords=words.map(w=>w.word);
  document.getElementById('recGrid').innerHTML=items.map(item=>{
    const ro=toRomaji(item.r);
    const isAdded=savedWords.includes(item.w);
    return `<div class="rec-card">
      <div class="rec-jp">${item.w}</div>
      <div class="rec-ro">${ro}</div>
      <div class="rec-mean">${item.m}</div>
      <button class="rec-add${isAdded?' added':''}" onclick="addRecWord(${enc(item.w)},${enc(item.r)},${enc(item.m)},this)" ${isAdded?'disabled':''}>
        ${isAdded?'✓ 추가됨':'+ 추가'}
      </button>
    </div>`;
  }).join('');
}
function refreshRec(){renderRec();}
async function addRecWord(word,reading,meaning,btn){
  if(words.find(w=>w.word===word)){
    btn.textContent='✓ 추가됨';btn.classList.add('added');btn.disabled=true;return;
  }
  if(!currentUser){alert('로그인이 필요해요.');return;}
  btn.textContent='저장 중...';btn.disabled=true;
  try{
    const {data,error}=await withTimeout(sb.from('words').insert([{user_id:currentUser.id,word,reading,meaning,jlpt:userLevel}]).select().single());
    if(error)throw error;
    words.unshift(data);
    btn.textContent='✓ 추가됨';
    btn.classList.add('added');
  }catch(e){
    console.error('addRecWord error',e);
    btn.textContent='+ 추가';btn.disabled=false;
    alert('저장 실패: '+(e.message||JSON.stringify(e)));
  }
}

// 단어 로드/저장/삭제
async function loadWords(){
  const {data,error}=await sb.from('words').select('*').order('created_at',{ascending:false});
  if(error){console.error('loadWords error',error);words=[];return;}
  words=data||[];
}
async function saveWord(word,reading,meaning,jlpt,btn){
  if(words.find(w=>w.word===word)){
    if(btn){btn.textContent='✓ 추가됨';btn.classList.add('added');btn.disabled=true;}
    return;
  }
  if(!currentUser){alert('로그인이 필요해요.');return;}
  if(btn){btn.textContent='저장 중...';btn.classList.add('saving');btn.disabled=true;}
  try{
    const {data,error}=await withTimeout(sb.from('words').insert([{user_id:currentUser.id,word,reading,meaning,jlpt}]).select().single());
    if(error)throw error;
    words.unshift(data);
    if(btn){btn.textContent='✓ 추가됨';btn.classList.remove('saving');btn.classList.add('added');}
  }catch(e){
    console.error('saveWord error',e);
    if(btn){btn.textContent='+ 단어장에 추가';btn.classList.remove('saving');btn.disabled=false;}
    alert('저장 실패: '+(e.message||JSON.stringify(e)));
  }
}
async function deleteWord(id){
  if(!confirm('이 단어를 삭제할까요?'))return;
  const {error}=await sb.from('words').delete().eq('id',id);
  if(!error){words=words.filter(w=>w.id!==id);if(openDictId===id)openDictId=null;renderList();}
}

// 탭
function switchTab(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['search','list','flash','quiz'][i]===t));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));

  if(t==='flash')startFlash();

}

// 검색
async function doSearch(){
  const q=document.getElementById('searchInput').value.trim();
  if(!q)return;
  const area=document.getElementById('resultArea');
  area.innerHTML='<div class="empty"><div class="icon">⏳</div>검색 중...</div>';
  try{
    const res=await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const data=await res.json();
    if(data.error){area.innerHTML=`<div class="empty">검색 API 오류<br><small style="color:#bbb">${data.error}${data.detail?': '+data.detail:''}</small></div>`;console.error('search api error',data);return;}
    if(!data.data||!data.data.length){area.innerHTML='<div class="empty">검색 결과가 없어요.</div>';return;}
    const note=data.translatedFrom?`<div style="font-size:12px;color:#888;margin-bottom:8px">'${data.translatedFrom}' → <b>${data.query}</b> (으)로 번역해 검색했어요</div>`:'';
    area.innerHTML=note+data.data.slice(0,4).map(item=>{
      const display=item.japanese[0]?.word||item.japanese[0]?.reading||item.slug;
      const reading=item.japanese[0]?.reading||'';
      const romaji=toRomaji(reading);
      const meaningEn=item.senses[0]?.english_definitions?.slice(0,3).join(', ')||'';
      const meaning=item.meaning_ko||meaningEn;
      const jlpt=(item.jlpt?.[0]||'').toUpperCase().replace('JLPT-','');
      const pos=item.senses[0]?.parts_of_speech?.slice(0,2)||[];
      const isAdded=!!words.find(w=>w.word===display);
      return `<div class="result-card">
        <div class="result-word">${display}</div>
        <div class="reading-row">
          <span class="reading-kana">${reading}</span>
          <span class="reading-sep">|</span>
          <span class="reading-label">로마자</span><span class="reading-val">${romaji}</span>
        </div>
        <div class="meaning-text">${meaning}</div>
        <div class="tags">${jlpt?`<span class="pill">${jlpt}</span>`:''}${pos.map(p=>`<span class="pill">${p}</span>`).join('')}</div>
        <button class="add-btn-full${isAdded?' added':''}" onclick="saveWord(${enc(display)},${enc(reading)},${enc(meaning)},${enc(jlpt)},this)" ${isAdded?'disabled':''}>${isAdded?'✓ 추가됨':'+ 단어장에 추가'}</button>
      </div>`;
    }).join('');
  }catch(e){
    area.innerHTML='<div class="empty">검색 중 오류가 발생했어요.<br><small style="color:#bbb">직접 검색은 배포 환경에서만 작동해요.</small></div>';
  }
}

    const data=await res.json();
    const exArea=document.getElementById('exampleArea');if(!exArea)return;
    const item=data.data?.[0];
    if(!item){exArea.innerHTML='정보를 찾지 못했어요.';return;}
    const senses=item.senses.slice(0,4).map((s,i)=>`<div style="margin-bottom:8px"><div class="dict-pos">${s.parts_of_speech?.join(', ')||''}</div><div class="dict-meaning">${i+1}. ${s.english_definitions?.join('; ')||''}</div></div>`).join('');
    exArea.innerHTML=`${senses}<div class="dict-example"><a class="dict-link" href="https://jisho.org/search/${encodeURIComponent(w.word)}%20%23sentences" target="_blank">Jisho에서 예문 더 보기 →</a></div>`;
  }catch(e){const exArea=document.getElementById('exampleArea');if(exArea)exArea.innerHTML='정보를 불러오지 못했어요.';}
}

// 단어장 렌더링
function renderList(){
  const panel=document.getElementById('dictPanel');
  if(openDictId===null)panel.style.display='none';
  const el=document.getElementById('wordList');
  if(!words.length){el.innerHTML='<div class="empty"><div class="icon">📖</div>아직 저장된 단어가 없어요.<br>검색 탭에서 단어를 추가해봐요!</div>';return;}
  el.innerHTML=`<div class="word-list">${words.map(w=>`
    <div class="word-row${openDictId===w.id?' open':''}" onclick="toggleDict('${w.id}')">
      <span class="jp">${w.word}</span>
      <span class="ro">${toRomaji(w.reading)}</span>
      <span class="mean">${w.meaning}</span>
      ${w.jlpt?`<span class="pill">${w.jlpt}</span>`:'<span></span>'}
      <button class="del-btn" onclick="event.stopPropagation();deleteWord('${w.id}')" aria-label="삭제">🗑</button>
    </div>`).join('')}</div>`;
}

// 플래시카드
function startFlash(onlyWrong=false){
  fcQueue=onlyWrong?words.filter(w=>wrongIds.has(w.id)):[...words];
  if(!fcQueue.length){document.getElementById('flashArea').innerHTML='<div class="empty"><div class="icon">🃏</div>단어장에 단어를 먼저 추가해봐요!</div>';return;}
  fcQueue.sort(()=>Math.random()-0.5);
  fcIdx=0;fcFlipped=false;wrongIds=new Set();rightCount=0;renderCard();
}
function renderCard(){
  const area=document.getElementById('flashArea');
  if(fcIdx>=fcQueue.length){
    area.innerHTML=`<div class="fc-done"><div class="score">${rightCount} / ${fcQueue.length}</div><p style="color:#888;margin-bottom:1.5rem">맞춘 단어</p>${wrongIds.size?`<button class="btn" style="margin-right:8px" onclick="startFlash(true)">틀린 ${wrongIds.size}개만 다시</button>`:''}<button class="btn" onclick="startFlash(false)">처음부터</button></div>`;return;
  }
  const w=fcQueue[fcIdx];fcFlipped=false;
  area.innerHTML=`<div class="fc-wrap">
    <div class="fc-stats"><div>${fcIdx+1} / ${fcQueue.length}</div><div><span class="status-dot" style="background:#5dcaa5"></span>맞음 <b>${rightCount}</b></div><div><span class="status-dot" style="background:#f09595"></span>틀림 <b>${wrongIds.size}</b></div></div>
    <div class="card-area" onclick="flipCard()">
      <div class="card-inner" id="cardInner">
        <div class="card-face"><p style="font-size:12px;color:#bbb">읽는 법과 뜻은?</p><div class="card-main">${w.word}</div><div class="card-hint">탭해서 뒤집기</div></div>
        <div class="card-face card-back"><div class="card-kana">${w.reading}</div><div class="card-ro-label">로마자</div><div class="card-ro-val">${toRomaji(w.reading)}</div><div class="card-mean">${w.meaning}</div>${w.jlpt?`<span class="pill" style="margin-top:6px">${w.jlpt}</span>`:''}</div>
      </div>
    </div>
    <div class="fc-btns" id="fcBtns" style="display:none">
      <button class="btn-wrong" onclick="markCard(false)">✕ 몰랐어요</button>
      <button class="btn-right" onclick="markCard(true)">✓ 알았어요</button>
    </div>
  </div>`;
}
function flipCard(){if(fcFlipped)return;fcFlipped=true;document.getElementById('cardInner').classList.add('flipped');document.getElementById('fcBtns').style.display='flex';}
function markCard(correct){if(correct)rightCount++;else wrongIds.add(fcQueue[fcIdx].id);fcIdx++;renderCard();}

// 단어시험
function selectMode(m){quizMode=m;document.querySelectorAll('.quiz-opt-btn').forEach(b=>b.classList.remove('selected'));document.getElementById('qopt-'+m).classList.add('selected');}
function startQuiz(){
  if(!words.length){document.getElementById('quizArea').innerHTML='<div class="empty"><div class="icon">✏️</div>단어장에 단어가 없어요.</div>';return;}
  const pool=[...words].sort(()=>Math.random()-0.5);
  quizWords=pool.slice(0,Math.min(10,pool.length));
  const modes=['kanji','romaji','meaning'];
  quizRevealed=quizWords.map((_,i)=>quizMode==='random'?modes[i%3]:quizMode);
  document.getElementById('quizSetup').style.display='none';
  renderQuizTable();
}
function renderQuizTable(){
  const rows=quizWords.map((w,i)=>{
    const rev=quizRevealed[i];const ro=toRomaji(w.reading);
    function cell(type){
      if(type===rev){const cls=type==='kanji'?'revealed-jp':type==='romaji'?'revealed-ro':'revealed-mean';const val=type==='kanji'?w.word:type==='romaji'?ro:w.meaning;return`<td class="${cls}">${val}</td>`;}
      return`<td><input class="quiz-input" id="qi-${i}-${type}" placeholder="?" autocomplete="off"><div class="quiz-answer" id="qa-${i}-${type}">${type==='kanji'?w.word:type==='romaji'?ro:w.meaning}</div></td>`;
    }
    return`<tr><td class="quiz-num">${i+1}</td>${cell('kanji')}${cell('romaji')}${cell('meaning')}</tr>`;
  }).join('');
  document.getElementById('quizArea').innerHTML=`
    <table class="quiz-table"><thead><tr><th></th><th>한자</th><th>로마자</th><th>한국어 뜻</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="quiz-actions">
      <button class="btn" onclick="document.getElementById('quizSetup').style.display='block';document.getElementById('quizArea').innerHTML=''">← 다시 설정</button>
      <button class="btn" onclick="startQuiz()">새 문제</button>
      <button class="btn btn-primary" onclick="checkQuiz()">✓ 정답 확인</button>
    </div>
    <div class="quiz-score" id="quizScore"></div>`;
}
function checkQuiz(){
  let correct=0,total=0;
  quizWords.forEach((w,i)=>{
    const rev=quizRevealed[i];const ro=toRomaji(w.reading);
    ['kanji','romaji','meaning'].forEach(type=>{
      if(type===rev)return;total++;
      const inp=document.getElementById(`qi-${i}-${type}`);const ans=document.getElementById(`qa-${i}-${type}`);if(!inp)return;
      const expected=type==='kanji'?w.word:type==='romaji'?ro:w.meaning;
      const ok=inp.value.trim().toLowerCase()===expected.toLowerCase();
      inp.classList.toggle('correct',ok);inp.classList.toggle('wrong',!ok&&inp.value.trim()!=='');
      if(ans)ans.classList.toggle('show',!ok);if(ok)correct++;
    });
  });
  const score=document.getElementById('quizScore');score.style.display='block';score.innerHTML=`결과: <b>${correct} / ${total}</b> 정답 🎉`;
}
</script>
